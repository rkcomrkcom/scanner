<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สแกนเหรียญฟิวเจอร์</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>สแกนเหรียญ</h1>
  <div id="tfs"></div>
  <button id="rescan">สแกนใหม่</button>
  <div id="acct"></div>
</header>
<details id="cfg"><summary>ตั้งค่าเงื่อนไข</summary><div id="cfgBody"></div></details>
<main>
  <div id="status"></div>
  <div id="list"></div>
  <h2>ออเดอร์จำลอง</h2>
  <div class="posbox"></div>
  <button id="reset">รีเซ็ตพอร์ต 10,000 USDT</button>
</main>
<div id="coin" hidden>
  <div class="bar"><button id="back">กลับหน้าสแกน</button><b id="cname"></b><span id="cpx"></span></div>
  <div class="wrap">
    <div id="charts"></div>
    <aside>
      <label>มาร์จิ้น (USDT)<input id="mg" type="number" value="100"></label>
      <label>Leverage<input id="lv" type="number" value="10"></label>
      <label>ทิศทาง<select id="ty"><option value="LONG">Long</option><option value="SHORT">Short</option></select></label>
      <fieldset><legend>TP เป้ากำไร (กรอกอันไหนก็ได้)</legend><div class="sr">
        <label>ราคา<input id="e-price" type="number" step="any"></label>
        <label>%<input id="e-pct" type="number" step="any"></label>
        <label>Points<input id="e-pts" type="number" step="any"></label></div></fieldset>
      <fieldset><legend>SL จุดตัดขาดทุน (กรอกอันไหนก็ได้)</legend><div class="sr">
        <label>ราคา<input id="sl-price" type="number" step="any"></label>
        <label>%<input id="sl-pct" type="number" step="any"></label>
        <label>Points<input id="sl-pts" type="number" step="any"></label></div></fieldset>
      <div id="calcRes"></div>
      <div id="rate"></div>
      <div class="go"><button class="LONG" id="go">เข้าออเดอร์ Long</button></div>
      <div id="msg"></div>
      <div class="posbox"></div>
    </aside>
  </div>
</div>
<script src="https://s3.tradingview.com/tv.js"></script>
<script src="scanner.js"></script>
<script src="trade.js"></script>
</body>
</html>
